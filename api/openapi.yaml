openapi: 3.1.0

info:
  title: CloudOptix API
  version: "1.0.0"
  summary: >-
    Autonomous cloud cost intelligence and optimization: architecture-aware
    discovery, economics, recommendations, governed automation and an
    auditable execution trail, all tenant-isolated.
  description: |
    CloudOptix models a customer's AWS estate as a digital twin, prices it,
    finds savings, and — within policy — executes and rolls back changes
    itself. This document describes the whole HTTP API a client (the
    CloudOptix web app, a CI pipeline calling the cost compiler, or a partner
    integration) talks to.

    ## Authentication
    Every route except `/healthz`, `/readyz`, `/metrics`, `/openapi.yaml` and
    the `Onboarding` tag requires a credential: either an OIDC-issued bearer
    JWT (`Authorization: Bearer <token>`) or a service API key
    (`X-CloudOptix-Api-Key: <key>`). See the `BearerAuth` and `ApiKeyAuth`
    security schemes below. A worker or CI system uses a service token
    (issued out of band) presented the same way as a user's bearer token.

    ## Tenant scope
    An OIDC principal may belong to more than one tenant; which one a
    request is scoped to is resolved from the token's own tenant claim when
    present, or from the `X-CloudOptix-Tenant` header otherwise, with a
    membership check either way — a header can select among tenants a
    principal actually belongs to, never grant a new one. A service token
    and an API key are each bound to exactly one tenant already, so the
    header is not needed (and is ignored) on those paths. Every path in this
    document is implicitly scoped to the resolved tenant; no path parameter
    ever names a tenant explicitly.

    ## Errors
    Every error response is `application/problem+json` (RFC 7807), extended
    with a stable machine-readable `code` and, for validation failures, a
    field-level `issues` array. See `Problem` under Schemas.

    A cross-tenant object reference (an id that is well-formed but belongs to
    a *different* tenant than the caller's) renders as `404 Not Found`, byte
    for byte identical to a genuinely nonexistent id — never `403 Forbidden`.
    A 403 would itself leak that the id is valid in some other tenant, which
    is the vulnerability the 404 mapping exists to close.

    ## Pagination
    List endpoints that can return more results than fit in one response use
    cursor pagination: pass `cursor` (opaque, from a previous response's
    `next_cursor`) and `limit`. There is no page number and no total-count
    guarantee on a first page, because the underlying store does not do a
    second scan just to report one. `sort` and `order` select the field and
    direction.

    ## Rate limits
    Every response carries `X-RateLimit-Remaining`, and a `429` additionally
    carries `Retry-After` (seconds). Limits are enforced per tenant, not per
    credential, so two service tokens for the same tenant share one budget.

    ## Idempotency
    Every mutating endpoint accepts an `Idempotency-Key` header. Replaying
    the same key with the same request body within the retention window
    returns the original response verbatim instead of repeating the
    mutation; replaying the same key with a *different* body is rejected
    with `409 Conflict` rather than silently executing either version.

    ## Streaming
    A handful of endpoints (marked below) respond with
    `text/event-stream` instead of JSON: onboarding chat turns, the AI
    copilot's answer, and long-running job progress (discovery runs,
    execution plans). Each is a thin SSE framing over the same
    synchronous/snapshot API described elsewhere in this document — see each
    operation's description for exactly what it polls or replays.
  contact:
    name: CloudOptix Platform Team
    url: https://cloudoptix.io
  license:
    name: Proprietary
    url: https://cloudoptix.io/terms

servers:
  - url: https://api.cloudoptix.io/api/v1
    description: Production
  - url: https://api.staging.cloudoptix.io/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Authentication
    description: Who the server thinks the caller is.
  - name: Onboarding
    description: >-
      The conversational flow that turns a prospective customer into a
      tenant with an approved specification. Unauthenticated end to end.
  - name: Specs
    description: Versioned, approvable specifications after onboarding.
  - name: Tenants
    description: Tenant profile and settings administration.
  - name: Users
    description: Tenant membership and role administration.
  - name: AWS Accounts
    description: Connecting, verifying and managing customer AWS accounts.
  - name: Discovery
    description: Scanning an AWS estate into CloudOptix's model.
  - name: Architecture
    description: The digital twin — the architecture graph and cost flow.
  - name: Resources
    description: Individual cloud resources, as views over the digital twin.
  - name: Costs
    description: Billed cost intelligence — summaries, series, anomalies.
  - name: Economics
    description: Cost attributed to business meaning — footprints, unit economics.
  - name: Cost SLOs
    description: Budget objectives with error budgets and breach actions.
  - name: Recommendations
    description: Ranked, evidenced savings opportunities.
  - name: Simulations
    description: Architecture mutation search and what-if counterfactuals.
  - name: Cost Compiler
    description: Pricing an infrastructure-as-code change set before it merges.
  - name: Cost Regression
    description: Budget assertions checked against a compiled change set.
  - name: Policies
    description: The rules governing what may auto-execute, need approval, or is prohibited.
  - name: Approvals
    description: Human decisions required by policy.
  - name: Automation
    description: Planning and running the autonomous optimization loop.
  - name: Executions
    description: The lifecycle of one approved, executable change.
  - name: Savings
    description: The realized-savings funnel, from potential to validated.
  - name: Audit
    description: The tamper-evident record of everything CloudOptix did.
  - name: AI Copilot
    description: Grounded natural-language answers over a tenant's own data.
  - name: Health
    description: >-
      Liveness, readiness and metrics — polled by infrastructure that has no
      CloudOptix credential and no tenant, so these are the only operations
      in this document mounted outside `/api/v1` and outside every
      authentication requirement.

security:
  - BearerAuth: []
  - ApiKeyAuth: []

# YAML anchors for parameters and error responses shared across dozens of
# operations. A vendor extension at the document root (x-*, permitted
# anywhere per the OpenAPI 3.1 Specification Extensions rule) rather than a
# components/ entry, because these are resolved by the YAML parser itself —
# before any OpenAPI tooling sees the document — while a $ref into
# components/parameters would still repeat one line per operation for no
# benefit; the effect on the parsed document is identical to writing every
# field out longhand at every one of the ~115 operations below, just without
# ~115 chances for one of those copies to drift from the rest.
x-anchors:
  tenant_header: &tenantHeader
    name: X-CloudOptix-Tenant
    in: header
    required: false
    schema: { type: string }
    description: >-
      Selects which of the caller's tenants this request is scoped to, when
      the credential (an OIDC token whose claims name no tenant) does not
      already imply one. Ignored by a service-token or API-key credential,
      each already bound to exactly one tenant. Never widens access beyond
      the caller's own memberships — see the Tenant scope section above.
    example: "tn_01hz3k4x8y"
  idempotency_key: &idempotencyKey
    name: Idempotency-Key
    in: header
    required: false
    schema: { type: string }
    description: >-
      Replaying the same key with an identical request body returns the
      original response verbatim; replaying it with a different body is
      rejected with 409 Conflict.
    example: "3f29b6d0-8a3e-4b7a-9c1e-2a6b6b1f9e21"
  cursor_param: &cursorParam
    name: cursor
    in: query
    schema: { type: string }
    description: Opaque continuation token from a previous response's `next_cursor`.
  limit_param: &limitParam
    name: limit
    in: query
    schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
  sort_param: &sortParam
    name: sort
    in: query
    schema: { type: string }
    description: Field to sort by.
  order_param: &orderParam
    name: order
    in: query
    schema: { type: string, enum: [asc, desc], default: asc }
  from_param: &fromParam
    name: from
    in: query
    schema: { type: string, format: date-time }
    description: Defaults to 30 days before `to` when omitted.
  to_param: &toParam
    name: to
    in: query
    schema: { type: string, format: date-time }
    description: Defaults to now when omitted.
  account_id_query: &accountIdQuery
    name: account_id
    in: query
    schema: { type: array, items: { type: string } }
    style: form
    explode: true
  region_query: &regionQuery
    name: region
    in: query
    schema: { type: array, items: { type: string } }
    style: form
    explode: true
  environment_query: &environmentQuery
    name: environment
    in: query
    schema: { type: array, items: { type: string } }
    style: form
    explode: true
  granularity_query: &granularityQuery
    name: granularity
    in: query
    schema: { type: string, enum: [hourly, daily, monthly], default: daily }
  id_path_param: &idPathParam
    name: id
    in: path
    required: true
    schema: { type: string }
  user_id_path_param: &userIDPathParam
    name: userID
    in: path
    required: true
    schema: { type: string }
  run_id_path_param: &runIDPathParam
    name: runID
    in: path
    required: true
    schema: { type: string }
  recommendation_id_path_param: &recommendationIDPathParam
    name: recommendationID
    in: path
    required: true
    schema: { type: string }
  compilation_id_path_param: &compilationIDPathParam
    name: compilationID
    in: path
    required: true
    schema: { type: string }
  common_errors: &commonErrors
    "400": { $ref: "#/components/responses/BadRequest" }
    "401": { $ref: "#/components/responses/Unauthorized" }
    "403": { $ref: "#/components/responses/Forbidden" }
    "404": { $ref: "#/components/responses/NotFound" }
    "409": { $ref: "#/components/responses/Conflict" }
    "429": { $ref: "#/components/responses/TooManyRequests" }
    "500": { $ref: "#/components/responses/InternalError" }

paths:
  # ================================================================
  # Health (mounted at the server root, not under /api/v1 — see the
  # Health tag's description)
  # ================================================================
  /healthz:
    servers:
      - url: https://api.cloudoptix.io
        description: Production
      - url: https://api.staging.cloudoptix.io
        description: Staging
      - url: http://localhost:8080
        description: Local development
    get:
      operationId: health.liveness
      tags: [Health]
      summary: Liveness probe
      security: []
      description: >-
        Process-internal checks only — never a database, cache, AWS or LLM
        provider dependency. Answers "should the orchestrator restart this
        pod", so it stays cheap and free of anything external that could
        make a healthy process look wedged.
      responses:
        "200":
          description: Live.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Degraded — at least one liveness check failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /readyz:
    servers:
      - url: https://api.cloudoptix.io
        description: Production
      - url: https://api.staging.cloudoptix.io
        description: Staging
      - url: http://localhost:8080
        description: Local development
    get:
      operationId: health.readiness
      tags: [Health]
      summary: Readiness probe
      security: []
      description: >-
        Every dependency a request actually needs (database, cache, AWS
        reachability). Answers "should the load balancer send this pod
        traffic right now".
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Not ready — at least one readiness check failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /metrics:
    servers:
      - url: https://api.cloudoptix.io
        description: Production
      - url: https://api.staging.cloudoptix.io
        description: Staging
      - url: http://localhost:8080
        description: Local development
    get:
      operationId: health.metrics
      tags: [Health]
      summary: Prometheus scrape endpoint
      security: []
      description: >-
        The platform's Prometheus registry in the standard exposition
        format — request counts and latencies by route, AWS and LLM call
        instrumentation, cache hit/miss counters, and the resilience
        primitives' own state (circuit breaker transitions, rate-limiter
        rejections).
      responses:
        "200":
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }

  # ================================================================
  # Authentication
  # ================================================================
  /auth/whoami:
    parameters: [*tenantHeader]
    get:
      operationId: auth.whoami
      tags: [Authentication]
      summary: Identify the caller
      description: >-
        Reflects back exactly what the authentication middleware resolved
        from the presented credential — subject, tenant, roles and which
        credential path was used. CloudOptix issues no session of its own;
        this exists so a client can confirm its token, tenant header and
        role mapping landed the way it expected before relying on them.
      responses:
        "200":
          description: The resolved principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmIResponse" }
        <<: *commonErrors

  # ================================================================
  # Onboarding (public — see the tag description)
  # ================================================================
  /onboarding:
    post:
      operationId: onboarding.start
      tags: [Onboarding]
      summary: Start an onboarding conversation
      security: []
      description: >-
        Opens a new conversation and returns the agent's opening turn. No
        tenant exists yet — onboarding is what produces the specification a
        tenant is created from. The returned `conversation_id` is the sole
        access control for every later call in this tag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartOnboardingRequest" }
      responses:
        "201":
          description: Conversation opened.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /onboarding/{conversationID}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: onboarding.send
      tags: [Onboarding]
      summary: Send a chat message
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "200":
          description: The agent's reply and updated state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /onboarding/{conversationID}/messages/stream:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: onboarding.send_stream
      tags: [Onboarding]
      summary: Send a chat message, streamed
      security: []
      description: >-
        The SSE surface for one chat turn. OnboardingService.Send is not
        itself a token-streaming API, so this emits a `thinking` event
        immediately, calls Send exactly once, then emits the completed
        `turn` (the same `OnboardingState` the non-streaming endpoint
        returns) followed by `done`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "200":
          description: >-
            `text/event-stream` of `thinking`, `turn` (data: OnboardingState)
            and `done` events, or a terminal `error` event carrying the same
            status/code/detail fields `Problem` uses. A failure detected
            before the stream is upgraded (a malformed body) is instead a
            normal `400` below, not an `error` event.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /onboarding/{conversationID}:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      operationId: onboarding.state
      tags: [Onboarding]
      summary: Get the current conversation state
      security: []
      responses:
        "200":
          description: Current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: onboarding.apply_edit
      tags: [Onboarding]
      summary: Apply a direct specification edit
      security: []
      description: >-
        Applies an edit made in the review UI directly, rather than through
        conversation — a JSON merge patch against the draft specification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyEditRequest" }
      responses:
        "200":
          description: Updated state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /onboarding/{conversationID}/summary:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    get:
      operationId: onboarding.summarize
      tags: [Onboarding]
      summary: Get the pre-approval review packet
      security: []
      responses:
        "200":
          description: Review summary.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /onboarding/{conversationID}/approve:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: onboarding.approve
      tags: [Onboarding]
      summary: Approve and create the tenant
      security: []
      description: >-
        Freezes the specification, creates the tenant, and returns both plus
        the AWS onboarding instructions (the role to create, the external
        id, the CloudFormation/Terraform snippet). The single transition
        from "talking about it" to "it exists".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveOnboardingRequest" }
      responses:
        "201":
          description: Tenant created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingResult" }
              example:
                tenant:
                  id: "tn_01hz3k4x8y"
                  slug: "acme-corp"
                  name: "Acme Corp"
                  plan: "standard"
                  state: "active"
                  demo: false
                spec_version: { id: "sv_01hz3k4xar", version: 1, status: "approved" }
                next_steps:
                  external_id: "ext-8f2c1e40"
                  trusted_principal_arn: "arn:aws:iam::111111111111:role/cloudoptix-platform"
                  role_names: { read: "CloudOptixRead", execute: "CloudOptixExecute" }
                  instructions:
                    - "Create the CloudOptixRead role in your account using the provided CloudFormation template."
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /onboarding/{conversationID}/cancel:
    parameters:
      - $ref: "#/components/parameters/ConversationID"
    post:
      operationId: onboarding.cancel
      tags: [Onboarding]
      summary: Abandon the conversation
      security: []
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelOnboardingRequest" }
      responses:
        "204": { description: Cancelled. }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ================================================================
  # Specs
  # ================================================================
  /specs/active:
    parameters: [*tenantHeader]
    get:
      operationId: specs.get_active
      tags: [Specs]
      summary: Get the active specification version
      responses:
        "200":
          description: The active version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecVersion" }
        <<: *commonErrors

  /specs:
    parameters: [*tenantHeader]
    get:
      operationId: specs.list_versions
      tags: [Specs]
      summary: List every specification version
      responses:
        "200":
          description: All versions, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpecVersion" }
        <<: *commonErrors

  /specs/diff:
    parameters: [*tenantHeader]
    get:
      operationId: specs.diff
      tags: [Specs]
      summary: Diff two specification versions
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: to
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The ordered list of field-level changes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SpecChange" }
        <<: *commonErrors

  /specs/validate:
    parameters: [*tenantHeader]
    post:
      operationId: specs.validate
      tags: [Specs]
      summary: Lint a candidate specification without persisting it
      description: >-
        Called on every keystroke-settled edit in the review UI, well before
        an operator commits to a revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Spec" }
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationResult" }
        <<: *commonErrors

  /specs/revisions:
    parameters: [*tenantHeader, *idempotencyKey]
    post:
      operationId: specs.propose_revision
      tags: [Specs]
      summary: Propose a new draft revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposeRevisionRequest" }
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecVersion" }
        <<: *commonErrors

  /specs/import:
    parameters: [*tenantHeader, *idempotencyKey]
    post:
      operationId: specs.import_yaml
      tags: [Specs]
      summary: Import a specification from YAML
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportYAMLRequest" }
      responses:
        "201":
          description: Imported draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecVersion" }
        <<: *commonErrors

  /specs/{id}:
    parameters: [*tenantHeader, *idPathParam]
    get:
      operationId: specs.get
      tags: [Specs]
      summary: Get one specification version
      responses:
        "200":
          description: The version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecVersion" }
        <<: *commonErrors

  /specs/{id}/export:
    parameters: [*tenantHeader, *idPathParam]
    get:
      operationId: specs.export_yaml
      tags: [Specs]
      summary: Export a specification version as YAML
      responses:
        "200":
          description: The YAML document, as a download.
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="spec.yaml"' }
          content:
            application/yaml:
              schema: { type: string }
        <<: *commonErrors

  /specs/{id}/approve:
    parameters: [*tenantHeader, *idPathParam, *idempotencyKey]
    post:
      operationId: specs.approve
      tags: [Specs]
      summary: Approve a draft revision
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveSpecRequest" }
      responses:
        "200":
          description: The now-active version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpecVersion" }
        <<: *commonErrors

  /specs/{id}/reject:
    parameters: [*tenantHeader, *idPathParam, *idempotencyKey]
    post:
      operationId: specs.reject
      tags: [Specs]
      summary: Reject a draft revision
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectSpecRequest" }
      responses:
        "204": { description: Rejected. }
        <<: *commonErrors

  # ================================================================
  # Tenants
  # ================================================================
  /tenant:
    parameters: [*tenantHeader]
    get:
      operationId: tenants.get
      tags: [Tenants]
      summary: Get the current tenant
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        <<: *commonErrors
    patch:
      operationId: tenants.update
      tags: [Tenants]
      summary: Update tenant profile and settings
      description: >-
        The path's tenant scope always wins over anything the request body
        claims — a caller cannot rename or reconfigure a different tenant by
        putting a different `id` in the body.
