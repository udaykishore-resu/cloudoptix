      summary: Get the architecture graph
      parameters:
        - name: view
          in: query
          schema: { type: string, default: architecture, enum: [architecture, cost, performance, reliability, security, economics] }
        - *accountIdQuery
        - *regionQuery
        - *environmentQuery
        - { name: application_id, in: query, schema: { type: string } }
        - { name: workload_id, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: root_id, in: query, schema: { type: string }, description: Root a subgraph at this node. }
        - { name: max_depth, in: query, schema: { type: integer } }
        - { name: min_monthly_cost, in: query, schema: { type: number } }
        - { name: search, in: query, schema: { type: string } }
        - { name: collapse, in: query, schema: { type: boolean }, description: Group low-value leaf nodes for readability at scale. }
      responses:
        "200":
          description: The graph.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwinGraph" }
        <<: *commonErrors

