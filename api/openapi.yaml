      tags: [AI Copilot]
      summary: Get one conversation
      responses:
        "200":
          description: The conversation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        <<: *commonErrors

  /copilot/suggestions:
    parameters: [*tenantHeader]
    get:
      operationId: copilot.suggestions
      tags: [AI Copilot]
      summary: Get suggested questions for the current tenant state
      description: What keeps an empty copilot screen useful.
      responses:
        "200":
          description: Suggested questions.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        <<: *commonErrors

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An OIDC-issued user JWT, an internal service token, or (in
        non-production deployments only) the fixed development static
        token. Validated per internal/infrastructure/auth: issuer, audience,
        expiry and signing algorithm are all checked, and `alg: none` is
        always rejected.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-CloudOptix-Api-Key
      description: A long-lived service API key, bound to exactly one tenant at issuance.

  parameters:
    # Every other path parameter (id, userID, runID, recommendationID,
    # compilationID) is defined once as a YAML anchor under x-anchors above
    # and reused by alias, rather than here — see that block's comment for
    # why. ConversationID is the one exception: it appears only on the
    # Onboarding tag's unauthenticated paths, so it is referenced there by
    # $ref instead of an anchor, and this is that one component.
    ConversationID:
      name: conversationID
      in: path
      required: true
      schema: { type: string }
      example: "conv_01hz3k2p9q"

  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: No credential was presented, or it was invalid or expired.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The caller is authenticated but lacks the required permission.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: >-
        Nothing exists at this id within the caller's tenant — including
        when the id belongs to a different tenant (see the Errors section
        above).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: >-
        An optimistic-concurrency conflict, or an Idempotency-Key reused
        with a different request body.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: The tenant's rate limit was exceeded.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: An unexpected error occurred. Detail is deliberately generic.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # -------------------------------------------------------------
    # Common
    # -------------------------------------------------------------
    Problem:
      type: object
      description: >-
        RFC 7807 problem+json, extended with a machine-readable `code` and,
        for validation failures, field-level `issues`.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, example: "https://docs.cloudoptix.io/errors/not-found" }
        title: { type: string, example: "Not Found" }
        status: { type: integer, example: 404 }
        detail: { type: string, example: "recommendation rec_123 not found" }
        instance: { type: string, example: "/api/v1/recommendations/rec_123" }
        code: { type: string, example: "not_found" }
        request_id: { type: string, example: "01hz3k4v9p8q7r6s5t4u3v2w" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }

    ValidationIssue:
      type: object
      required: [path, code, message, severity]
      properties:
        path: { type: string, example: "name" }
        code: { type: string, example: "required" }
        message: { type: string, example: "name is required" }
        severity: { $ref: "#/components/schemas/Severity" }
        hint: { type: string }

    ValidationResult:
      type: object
      properties:
        issues:
          type: array
          items: { $ref: "#/components/schemas/ValidationIssue" }

    Severity:
      type: string
      enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]

    RiskLevel:
      type: string
      enum: [NONE, LOW, MEDIUM, HIGH, CRITICAL]

    Criticality:
      type: string
      enum: [TIER_0, TIER_1, TIER_2, TIER_3, UNSET]

    Provenance:
      type: string
      description: How CloudOptix came to believe a fact.
      enum: [CONFIRMED, INFERRED, UNKNOWN, REQUIRES_USER_CONFIRMATION]

    Confidence:
      type: number
      minimum: 0
      maximum: 1
      description: A 0..1 confidence score.

    Money:
      type: object
      description: An exact monetary amount, stored as integer micros to avoid floating-point drift.
      required: [micros, currency, amount, display]
      properties:
        micros: { type: integer, format: int64, example: 4110000000, description: "Exact amount in 1/1,000,000ths of a unit." }
        currency: { type: string, example: USD }
        amount: { type: number, example: 4110.00, description: "Convenience float; micros is authoritative." }
        display: { type: string, example: "$4,110.00" }

    Period:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    Percentiles:
      type: object
      properties:
        min: { type: number }
        p50: { type: number }
        p90: { type: number }
        p95: { type: number }
        p99: { type: number }
        max: { type: number }
        mean: { type: number }
        std_dev: { type: number }

    Tags:
      type: object
      additionalProperties: { type: string }

    HealthCheckResult:
      type: object
      properties:
        name: { type: string, example: postgres }
        status: { type: string, enum: [ok, error] }
        error: { type: string }

    HealthResponse:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string, example: cloudoptix-api }
        version: { type: string, example: "1.4.2" }
        uptime_seconds: { type: number }
        checks: { type: array, items: { $ref: "#/components/schemas/HealthCheckResult" } }
        checked_at: { type: string, format: date-time }

    WhoAmIResponse:
      type: object
      properties:
        subject: { type: string, example: "auth0|63f..." }
        tenant_id: { type: string, example: "tn_01hz3k4x8y" }
        email: { type: string, example: "alex@acme.com" }
        name: { type: string, example: "Alex Rivera" }
        roles:
          type: array
          items: { type: string, example: finops_analyst }
        machine: { type: boolean }
        auth_method: { type: string, enum: [oidc, service_token, dev_token, api_key] }

    # -------------------------------------------------------------
    # Onboarding
    # -------------------------------------------------------------
    StartOnboardingRequest:
      type: object
      properties:
        actor: { type: string }
        actor_email: { type: string, format: email }
        initial_message: { type: string }
        existing_tenant: { type: string, description: "Set when an established tenant is revising its specification." }

    SendMessageRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "We run a checkout service on ECS Fargate behind an ALB." }

    ApplyEditRequest:
      type: object
      properties:
        patch: { type: object, additionalProperties: true, description: "A JSON merge patch against the draft specification." }
        actor: { type: string }

    ApproveOnboardingRequest:
      type: object
      required: [tenant_name, tenant_slug]
      properties:
        actor: { type: string }
        actor_email: { type: string, format: email }
        tenant_name: { type: string, example: "Acme Corp" }
        tenant_slug: { type: string, example: "acme-corp" }
        plan: { type: string, enum: [trial, standard, enterprise, internal], default: trial }

    CancelOnboardingRequest:
      type: object
      properties:
        reason: { type: string }

    FieldState:
      type: object
      properties:
        path: { type: string }
        label: { type: string }
        value: { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }
        rationale: { type: string }
        source: { type: string }

    OpenQuestion:
      type: object
      properties:
        path: { type: string }
        question: { type: string }
        why: { type: string }
        required: { type: boolean }
        blocking: { type: boolean }
        options: { type: array, items: { type: string } }
        asked_count: { type: integer }

    OnboardingState:
      type: object
      properties:
        conversation_id: { type: string }
        reply: { type: string }
        stage: { type: string, enum: [organization, application, aws, workloads, business, objectives, governance, review] }
        draft: { $ref: "#/components/schemas/Spec" }
        completeness: { $ref: "#/components/schemas/SpecCompleteness" }
        collected: { type: array, items: { $ref: "#/components/schemas/FieldState" } }
        inferred: { type: array, items: { $ref: "#/components/schemas/FieldState" } }
        unknown: { type: array, items: { $ref: "#/components/schemas/FieldState" } }
        needs_confirmation: { type: array, items: { $ref: "#/components/schemas/FieldState" } }
        open_questions: { type: array, items: { $ref: "#/components/schemas/OpenQuestion" } }
        validation: { $ref: "#/components/schemas/ValidationResult" }
        ready_for_review: { type: boolean }
        suggestions: { type: array, items: { type: string } }
        degraded: { type: boolean, description: "True when answered without the model." }

    SummarySection:
      type: object
      properties:
        title: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/FieldState" } }
        note: { type: string }

    OnboardingSummary:
      type: object
      properties:
        conversation_id: { type: string }
        spec: { $ref: "#/components/schemas/Spec" }
        spec_yaml: { type: string }
        completeness: { $ref: "#/components/schemas/SpecCompleteness" }
        validation: { $ref: "#/components/schemas/ValidationResult" }
        sections: { type: array, items: { $ref: "#/components/schemas/SummarySection" } }
        what_happens_next: { type: array, items: { type: string } }
        can_approve: { type: boolean }
        blocking_reasons: { type: array, items: { type: string } }

    AWSOnboardingInstructions:
      type: object
      properties:
        external_id: { type: string, example: "ext-8f2c1e40" }
        trusted_principal_arn: { type: string, example: "arn:aws:iam::111111111111:role/cloudoptix-platform" }
        role_names: { type: object, additionalProperties: { type: string } }
        policy_documents: { type: object, additionalProperties: { type: string } }
        cloudformation_url: { type: string, format: uri }
        terraform_module: { type: string }
        instructions: { type: array, items: { type: string } }

    OnboardingResult:
      type: object
      properties:
        tenant: { $ref: "#/components/schemas/Tenant" }
        spec_version: { $ref: "#/components/schemas/SpecVersion" }
        next_steps: { $ref: "#/components/schemas/AWSOnboardingInstructions" }

    # -------------------------------------------------------------
    # Specs
    # -------------------------------------------------------------
    Spec:
      type: object
      description: >-
        The full onboarding specification: organization, application, AWS
        access, workloads, business context, objectives, optimization and
        automation posture, governance, security, observability,
        notifications and teams. Deliberately not expanded field by field
        here — it is a large, evolving nested document (see
        internal/domain/spec/spec.go, the source of truth) that a client
        reads and writes as a structured whole via the onboarding and specs
        endpoints, most of which never need to address a field within it
        directly.
      required: [api_version, kind]
      properties:
        api_version: { type: string, example: "cloudoptix.io/v1" }
        kind: { type: string, example: "Specification" }
        organization: { type: object, additionalProperties: true }
        application: { type: object, additionalProperties: true }
        aws: { type: object, additionalProperties: true }
        workloads: { type: array, items: { type: object, additionalProperties: true } }
        business: { type: object, additionalProperties: true }
        objectives: { type: object, additionalProperties: true }
        optimization: { type: object, additionalProperties: true }
        automation: { type: object, additionalProperties: true }
        governance: { type: object, additionalProperties: true }
        security: { type: object, additionalProperties: true }
        observability: { type: object, additionalProperties: true }
        notifications: { type: object, additionalProperties: true }
        teams: { type: array, items: { type: object, additionalProperties: true } }
        open_questions: { type: array, items: { $ref: "#/components/schemas/OpenQuestion" } }

    SpecCompleteness:
      type: object
      properties:
        total_fields: { type: integer }
        confirmed: { type: integer }
        inferred: { type: integer }
        unknown: { type: integer }
        needs_confirmation: { type: integer }
        score: { type: number }
        ready_for_review: { type: boolean }
        blocking_gaps: { type: array, items: { type: string } }

    SpecChange:
      type: object
      properties:
        path: { type: string }
        kind: { type: string, enum: [added, removed, changed] }
        before: { type: string }
        after: { type: string }
        impact: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }

    SpecVersion:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        spec_id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [draft, proposed, approved, rejected, superseded] }
        spec: { $ref: "#/components/schemas/Spec" }
        checksum: { type: string }
        parent_id: { type: string }
        diff: { type: array, items: { $ref: "#/components/schemas/SpecChange" } }
        validation: { $ref: "#/components/schemas/ValidationResult" }

    ProposeRevisionRequest:
      type: object
      properties:
        patch: { type: object, additionalProperties: true }
        actor: { type: string }

    ApproveSpecRequest:
      type: object
      properties:
        actor: { type: string }

    RejectSpecRequest:
      type: object
      properties:
        reason: { type: string }
        actor: { type: string }

    ImportYAMLRequest:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string }
        actor: { type: string }

    # -------------------------------------------------------------
    # Tenants / Users
    # -------------------------------------------------------------
    Tenant:
      type: object
      properties:
        id: { type: string, example: "tn_01hz3k4x8y" }
        slug: { type: string, example: "acme-corp" }
        name: { type: string, example: "Acme Corp" }
        plan: { type: string, enum: [trial, standard, enterprise, internal] }
        quotas: { type: object, additionalProperties: true }
        state: { type: string, enum: [active, suspended, closed] }
        spec_id: { type: string }
        active_spec_version: { type: integer }
        active_policy_id: { type: string }
        demo: { type: boolean }

    Membership:
      type: object
      properties:
        tenant_id: { type: string }
        roles:
          type: array
          items: { type: string, enum: [platform_admin, tenant_admin, architect, finops_analyst, sre, developer, auditor, viewer] }

    User:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        memberships: { type: array, items: { $ref: "#/components/schemas/Membership" } }
        last_login_at: { type: string, format: date-time }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UserPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/User" } }

    InviteUserRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        roles: { type: array, items: { type: string } }

    UpdateRolesRequest:
      type: object
      required: [roles]
      properties:
        roles: { type: array, items: { type: string } }

    PageEnvelope:
      type: object
      description: The cursor-pagination envelope every list endpoint shares.
      properties:
        next_cursor: { type: string }
        total: { type: integer }

    # -------------------------------------------------------------
    # AWS Accounts
    # -------------------------------------------------------------
    AWSAccount:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        account_id: { type: string, example: "111111111111" }
        alias: { type: string, example: "prod" }
        environment: { type: string, example: "production" }
        regions: { type: array, items: { type: string }, example: ["us-east-1", "us-west-2"] }
        access_mode: { type: string, enum: [assume_role, simulated] }
        role_arns: { type: object, additionalProperties: { type: string } }
        external_id: { type: string }
        session_prefix: { type: string }
        state: { type: string, enum: [pending, connected, degraded, suspended, error] }
        state_reason: { type: string }
        granted_scopes: { type: array, items: { type: string, enum: [read, analyze, plan, execute] } }
        missing_actions: { type: array, items: { type: string } }
        is_payer: { type: boolean }
        cur_bucket: { type: string }
        cur_prefix: { type: string }
        connected_at: { type: string, format: date-time }
        last_verified_at: { type: string, format: date-time }
        last_discovery_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RegisterAccountRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string, example: "111111111111" }
        alias: { type: string }
        environment: { type: string, example: "production" }
        regions: { type: array, items: { type: string } }
        access_mode: { type: string, enum: [assume_role, simulated], default: assume_role }
        role_arns:
          type: object
          additionalProperties: { type: string }
          description: "Map of role scope (read|analyze|plan|execute) to the ARN CloudOptix should assume for it."
        is_payer: { type: boolean }
        cur_bucket: { type: string }
        cur_prefix: { type: string }

    SuspendAccountRequest:
      type: object
      properties:
        reason: { type: string }

    # -------------------------------------------------------------
    # Discovery
    # -------------------------------------------------------------
    ServiceScanResult:
      type: object
      properties:
        service: { type: string, example: ec2 }
        region: { type: string }
        succeeded: { type: boolean }
        count: { type: integer }
        duration_ms: { type: integer }
        api_call_count: { type: integer }
        throttled: { type: integer }
        error: { type: string }

    DiscoveryRun:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        account_id: { type: string }
        regions: { type: array, items: { type: string } }
        trigger: { type: string, enum: [onboarding, scheduled, manual, post_execution] }
        state: { type: string, enum: [running, completed, partial, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        resources_discovered: { type: integer }
        resources_updated: { type: integer }
        resources_removed: { type: integer }
        relationships_found: { type: integer }
        metrics_collected: { type: integer }
        service_results: { type: array, items: { $ref: "#/components/schemas/ServiceScanResult" } }
        errors: { type: array, items: { type: string } }
        coverage: { type: number }
        duration_ms: { type: integer }

    RunDiscoveryRequest:
      type: object
      properties:
        account_id: { type: string, description: "Empty scans every account in the tenant." }
        regions: { type: array, items: { type: string } }
        services: { type: array, items: { type: string } }
        trigger: { type: string, default: manual }
        include_metrics: { type: boolean }
        include_cost: { type: boolean }
        async: { type: boolean }

    DiscoveryStatus:
      type: object
      properties:
        last_run_at: { type: string, format: date-time }
        resource_count: { type: integer }
        accounts_covered: { type: integer }
        accounts_total: { type: integer }
        coverage: { type: number }
        in_progress: { type: boolean }
        recent_runs: { type: array, items: { $ref: "#/components/schemas/DiscoveryRun" } }
        permission_issues: { type: array, items: { type: string } }

    # -------------------------------------------------------------
    # Architecture (twin) / Resources
    # -------------------------------------------------------------
    TwinNode:
      type: object
      description: >-
        One graph node with everything a resource detail panel or a
        resource-list row needs — the twin is the resource model enriched
        with cost, risk and topology, so this schema also serves the
        Resources tag.
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, example: "ec2:instance" }
        category: { type: string, example: compute }
        service: { type: string, example: EC2 }
        account_id: { type: string }
        region: { type: string }
        availability_zone: { type: string }
        environment: { type: string }
        state: { type: string, example: running }
        monthly_cost: { $ref: "#/components/schemas/Money" }
        economic_footprint: { $ref: "#/components/schemas/Money" }
        cost_share: { type: number }
        cpu: { $ref: "#/components/schemas/Percentiles" }
        memory: { $ref: "#/components/schemas/Percentiles" }
        latency_p99_ms: { type: number }
        error_rate: { type: number }
        availability: { type: number }
        risk: { $ref: "#/components/schemas/RiskLevel" }
        criticality: { $ref: "#/components/schemas/Criticality" }
        owner: { type: string }
        application: { type: string }
        workload: { type: string }
        tags: { $ref: "#/components/schemas/Tags" }
        finding_count: { type: integer }
        potential_saving: { $ref: "#/components/schemas/Money" }

    TwinEdge:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        kind: { type: string, example: "depends_on" }
        weight: { type: number }

    TwinStats:
      type: object
      properties:
        node_count: { type: integer }
        edge_count: { type: integer }
        total_monthly_cost: { $ref: "#/components/schemas/Money" }

    TwinGraph:
      type: object
      properties:
        nodes: { type: array, items: { $ref: "#/components/schemas/TwinNode" } }
        edges: { type: array, items: { $ref: "#/components/schemas/TwinEdge" } }
        stats: { $ref: "#/components/schemas/TwinStats" }
        view: { type: string }
        legend: { type: object, additionalProperties: { type: string } }
        truncated: { type: boolean }

    CostFlowNode:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        share: { type: number }

    CostFlowLevel:
      type: object
      properties:
        depth: { type: integer }
        nodes: { type: array, items: { $ref: "#/components/schemas/CostFlowNode" } }

    CostFlowLink:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        basis: { type: string }

    CostFlowGraph:
      type: object
      properties:
        levels: { type: array, items: { $ref: "#/components/schemas/CostFlowLevel" } }
        links: { type: array, items: { $ref: "#/components/schemas/CostFlowLink" } }
        total: { $ref: "#/components/schemas/Money" }
        unattributed: { $ref: "#/components/schemas/Money" }
        period: { $ref: "#/components/schemas/Period" }

    # -------------------------------------------------------------
    # Costs
    # -------------------------------------------------------------
    IngestCostRequest:
      type: object
      required: [account_id]
      properties:
        account_id: { type: string }

    IngestResult:
      type: object
      properties:
        records_ingested: { type: integer }
        period: { $ref: "#/components/schemas/Period" }
        source: { type: string }
        total_cost: { $ref: "#/components/schemas/Money" }
        resource_coverage: { type: number }
        duration_ms: { type: integer }

    CostPoint:
      type: object
      properties:
        period: { $ref: "#/components/schemas/Period" }
        amount: { $ref: "#/components/schemas/Money" }

    CostSeries:
      type: object
      properties:
        granularity: { type: string, enum: [hourly, daily, monthly] }
        points: { type: array, items: { $ref: "#/components/schemas/CostPoint" } }
        currency: { type: string }

    BreakdownItem:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        share: { type: number }
        prior_amount: { $ref: "#/components/schemas/Money" }
        change_pct: { type: number }
        resource_count: { type: integer }

    CostBreakdown:
      type: object
      properties:
        dimension: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        total: { $ref: "#/components/schemas/Money" }
        items: { type: array, items: { $ref: "#/components/schemas/BreakdownItem" } }

    CostForecast:
      type: object
      properties:
        period: { $ref: "#/components/schemas/Period" }
        expected: { $ref: "#/components/schemas/Money" }
        low: { $ref: "#/components/schemas/Money" }
        high: { $ref: "#/components/schemas/Money" }
        method: { type: string, example: "holt_winters" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        based_on_days: { type: integer }
        note: { type: string }

    Contribution:
      type: object
      properties:
        dimension: { type: string }
        key: { type: string }
        delta: { $ref: "#/components/schemas/Money" }
        share: { type: number }
        note: { type: string }

    CostAnomaly:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        detected_at: { type: string, format: date-time }
        period: { $ref: "#/components/schemas/Period" }
        dimension: { type: string, enum: [service, account, usage_type, application] }
        key: { type: string }
        expected: { $ref: "#/components/schemas/Money" }
        actual: { $ref: "#/components/schemas/Money" }
        delta: { $ref: "#/components/schemas/Money" }
        delta_pct: { type: number }
        score: { type: number, description: "Robust z-score." }
        severity: { $ref: "#/components/schemas/Severity" }
        explanation: { type: string }
        contributors: { type: array, items: { $ref: "#/components/schemas/Contribution" } }

    LinkedChange:
      type: object
      properties:
        kind: { type: string, enum: [execution, compilation, discovery_delta] }
        id: { type: string }
        label: { type: string }
        at: { type: string, format: date-time }
        cost_impact: { $ref: "#/components/schemas/Money" }
        correlation: { type: number }

    CostExplanation:
      type: object
      properties:
        current_period: { $ref: "#/components/schemas/Period" }
        baseline_period: { $ref: "#/components/schemas/Period" }
        current_total: { $ref: "#/components/schemas/Money" }
        baseline_total: { $ref: "#/components/schemas/Money" }
        delta: { $ref: "#/components/schemas/Money" }
        delta_pct: { type: number }
        contributors: { type: array, items: { $ref: "#/components/schemas/Contribution" } }
        narrative: { type: string }
        linked_changes: { type: array, items: { $ref: "#/components/schemas/LinkedChange" } }

    CostSummary:
      type: object
      properties:
        period: { $ref: "#/components/schemas/Period" }
        total: { $ref: "#/components/schemas/Money" }
        daily_average: { $ref: "#/components/schemas/Money" }
        month_to_date: { $ref: "#/components/schemas/Money" }
        prior_month: { $ref: "#/components/schemas/Money" }
        change_pct: { type: number }
        forecast: { $ref: "#/components/schemas/CostForecast" }
        by_service: { $ref: "#/components/schemas/CostBreakdown" }
        by_account: { $ref: "#/components/schemas/CostBreakdown" }
        by_environment: { $ref: "#/components/schemas/CostBreakdown" }
        by_application: { $ref: "#/components/schemas/CostBreakdown" }
        trend: { $ref: "#/components/schemas/CostSeries" }
        open_anomalies: { type: integer }
        last_ingested_at: { type: string, format: date-time }
        freshness: { type: string }

    # -------------------------------------------------------------
    # Economics / Cost SLOs
    # -------------------------------------------------------------
    EconomicsScope:
      type: string
      enum: [organization, account, environment, application, workload, business_capability, api, transaction, resource]

    FootprintComponent:
      type: object
      properties:
        resource_id: { type: string }
        resource_name: { type: string }
        kind: { type: string }
        service: { type: string }
        class: { type: string, enum: [direct, indirect, shared] }
        amount: { $ref: "#/components/schemas/Money" }
        allocation_share: { type: number }
        basis: { type: string }
        provenance: { $ref: "#/components/schemas/Provenance" }

    Footprint:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        scope: { $ref: "#/components/schemas/EconomicsScope" }
        scope_id: { type: string }
        label: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        direct: { $ref: "#/components/schemas/Money" }
        indirect: { $ref: "#/components/schemas/Money" }
        shared: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        unattributed: { $ref: "#/components/schemas/Money" }
        coverage: { type: number }
        components: { type: array, items: { $ref: "#/components/schemas/FootprintComponent" } }

    VolumeSource:
      type: object
      properties:
        kind: { type: string, enum: [cloudwatch, declared, prometheus, alb_requests] }
        namespace: { type: string }
        metric_name: { type: string }
        dimensions: { type: object, additionalProperties: { type: string } }

    BusinessTransaction:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string, example: checkout }
        description: { type: string }
        application_id: { type: string }
        workload_ids: { type: array, items: { type: string } }
        path_share: { type: object, additionalProperties: { type: number } }
        volume_source: { $ref: "#/components/schemas/VolumeSource" }
        provenance: { $ref: "#/components/schemas/Provenance" }
        criticality: { $ref: "#/components/schemas/Criticality" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Driver:
      type: object
      description: One contributor to a unit-economics movement (volume, unit cost, or mix change).
      additionalProperties: true

    UnitEconomics:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        transaction_id: { type: string }
        name: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        volume: { type: number }
        total_cost: { $ref: "#/components/schemas/Money" }
        cost_per_unit: { $ref: "#/components/schemas/Money" }
        direct_per_unit: { $ref: "#/components/schemas/Money" }
        shared_per_unit: { $ref: "#/components/schemas/Money" }
        prior_cost_per_unit: { $ref: "#/components/schemas/Money" }
        change_pct: { type: number }
        drivers: { type: array, items: { $ref: "#/components/schemas/Driver" } }

    EconomicsResult:
      type: object
      properties:
        period: { $ref: "#/components/schemas/Period" }
        footprints_computed: { type: integer }
        total_attributed: { $ref: "#/components/schemas/Money" }
        total_unattributed: { $ref: "#/components/schemas/Money" }
        coverage: { type: number }
        transactions_priced: { type: integer }
        duration_ms: { type: integer }

    EfficiencyFactor:
      type: object
      description: One weighted input into an efficiency score.
      additionalProperties: true

    EfficiencyScore:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        scope: { $ref: "#/components/schemas/EconomicsScope" }
        scope_id: { type: string }
        label: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        score: { type: number }
        grade: { type: string, example: B+ }
        factors: { type: array, items: { $ref: "#/components/schemas/EfficiencyFactor" } }
        prior_score: { type: number }
        delta: { type: number }
        waste_ratio: { type: number }
        total_spend: { $ref: "#/components/schemas/Money" }
        identified_waste: { $ref: "#/components/schemas/Money" }
        computed_at: { type: string, format: date-time }

    BreachAction:
      type: object
      description: What CloudOptix does when a cost SLO's error budget is exhausted.
      additionalProperties: true

    CostSLO:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, description: "Money-denominated or ratio-denominated (waste, efficiency)." }
        direction: { type: string }
        scope: { $ref: "#/components/schemas/EconomicsScope" }
        scope_id: { type: string }
        transaction_id: { type: string }
        target: { $ref: "#/components/schemas/Money" }
        target_ratio: { type: number }
        window: { type: string, enum: [calendar_month, rolling_30d, rolling_7d] }
        error_budget_pct: { type: number, example: 0.05 }
        breach_actions: { type: array, items: { $ref: "#/components/schemas/BreachAction" } }
        owner: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    EconomicErrorBudget:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        slo_id: { type: string }
        slo_name: { type: string }
        kind: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        target: { $ref: "#/components/schemas/Money" }
        budget_amount: { $ref: "#/components/schemas/Money" }
        actual: { $ref: "#/components/schemas/Money" }
        consumed: { $ref: "#/components/schemas/Money" }
        remaining: { $ref: "#/components/schemas/Money" }
        consumed_ratio: { type: number }
        burn_rate: { type: number, description: "1.0 lands exactly at zero at window end; 2.0 burns twice as fast." }

    ExecutiveSummary:
      type: object
      properties:
        period: { $ref: "#/components/schemas/Period" }
        monthly_spend: { $ref: "#/components/schemas/Money" }
        forecast_month_end: { $ref: "#/components/schemas/Money" }
        prior_month_spend: { $ref: "#/components/schemas/Money" }
        spend_change_pct: { type: number }
        potential_savings: { $ref: "#/components/schemas/Money" }
        realized_savings: { $ref: "#/components/schemas/Money" }
        realized_annualized: { $ref: "#/components/schemas/Money" }
        waste_pct: { type: number }
        efficiency_score: { type: number }
        efficiency_grade: { type: string }
        cost_slos_healthy: { type: integer }
        cost_slos_at_risk: { type: integer }
        cost_slos_breached: { type: integer }
        budget_states: { type: array, items: { $ref: "#/components/schemas/EconomicErrorBudget" } }
        top_opportunities: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }
        top_transactions: { type: array, items: { $ref: "#/components/schemas/UnitEconomics" } }
        savings_funnel: { $ref: "#/components/schemas/SavingsFunnel" }
        generated_at: { type: string, format: date-time }

    # -------------------------------------------------------------
    # Recommendations
    # -------------------------------------------------------------
    AnalyzeRequest:
      type: object
      properties:
        account_ids: { type: array, items: { type: string } }
        environments: { type: array, items: { type: string } }
        categories: { type: array, items: { type: string } }
        rule_ids: { type: array, items: { type: string } }
        generate_narratives: { type: boolean, description: "Ask the LLM to write human explanations; never affects which recommendations exist or their scores." }
        async: { type: boolean }

    AnalyzeResult:
      type: object
      properties:
        run_id: { type: string }
        resources_analyzed: { type: integer }
        rules_evaluated: { type: integer }
        findings_produced: { type: integer }
        recommendations_created: { type: integer }
        superseded: { type: integer }
        mutually_exclusive_alternatives:
          type: integer
          description: >-
            How many of recommendations_created are alternatives within a
            conflict group and therefore excluded from total_monthly_saving.
        total_monthly_saving: { $ref: "#/components/schemas/Money" }
        total_annual_saving: { $ref: "#/components/schemas/Money" }
        auto_executable: { type: integer }
        requiring_approval: { type: integer }
        prohibited: { type: integer }
        duration_ms: { type: integer }
        warnings: { type: array, items: { type: string } }

    Finding:
      type: object
      description: The evidenced observation a recommendation is built from.
      additionalProperties: true

    StateSnapshot:
      type: object
      description: A resource's configuration before or after a proposed change.
      additionalProperties: true

    ConfidenceInput:
      type: object
      description: One input into a recommendation's confidence score.
      additionalProperties: true

    RiskAssessment:
      type: object
      description: The structured risk assessment behind a recommendation's risk level.
      additionalProperties: true

    BlastRadius:
      type: object
      description: What else is affected if this recommendation's action runs.
      additionalProperties: true

    Recommendation:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        finding: { $ref: "#/components/schemas/Finding" }
        title: { type: string }
        rationale: { type: string }
        action: { type: string, example: "rightsize_instance" }
        parameters: { type: object, additionalProperties: true, description: "The only input the executor reads — never re-derived from prose." }
        current_state: { $ref: "#/components/schemas/StateSnapshot" }
        proposed_state: { $ref: "#/components/schemas/StateSnapshot" }
        estimated_monthly_saving: { $ref: "#/components/schemas/Money" }
        estimated_annual_saving: { $ref: "#/components/schemas/Money" }
        implementation_cost: { $ref: "#/components/schemas/Money" }
        payback_days: { type: number }
        confidence: { $ref: "#/components/schemas/Confidence" }
        confidence_basis: { type: array, items: { $ref: "#/components/schemas/ConfidenceInput" } }
        risk: { $ref: "#/components/schemas/RiskAssessment" }
        blast_radius: { $ref: "#/components/schemas/BlastRadius" }
        reversibility: { type: string }
        complexity: { type: string }
        priority_score: { type: number }
        rank: { type: integer }
        conflict_domain:
          type: string
          description: >-
            What this change contends for on its resource. Two recommendations
            that target the same resource in the same domain are mutually
            exclusive; changes in different domains compose.
        conflict_group_id:
          type: string
          description: The set of mutually exclusive recommendations this one belongs to. Absent when it competes with nothing.
        mutually_exclusive:
          type: boolean
          description: True when at most one member of this recommendation's conflict group can be applied.
        alternative_ids:
          type: array
          items: { type: string }
          description: The other members of this recommendation's conflict group, in the order the priority formula ranks them.
        preferred_alternative_id:
          type: string
          description: >-
            The member of this conflict group CloudOptix recommends instead of
            this one. Empty on the recommended change. A recommendation with
            this set is excluded from every savings total, because its saving
            is the same money another recommendation already counts.
        status: { type: string, enum: [open, dismissed, snoozed, planned, executed, superseded] }
        status_reason: { type: string }
        snoozed_until: { type: string, format: date-time }
        requires_approval: { type: boolean }
        policy_decision_id: { type: string }
        auto_executable: { type: boolean }
        narrative: { type: string, description: "LLM-generated explanation; decorative — removing it changes nothing about what executes." }

    RecommendationPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Recommendation" } }

    RecommendationSummary:
      type: object
      properties:
        open: { type: integer }
        total_monthly_saving: { $ref: "#/components/schemas/Money" }
        by_category: { type: object, additionalProperties: { type: integer } }
        saving_by_category: { type: object, additionalProperties: { $ref: "#/components/schemas/Money" } }
        by_risk: { type: object, additionalProperties: { type: integer } }
        auto_executable: { type: integer }
        awaiting_approval: { type: integer }
        mutually_exclusive_alternatives:
          type: integer
          description: >-
            How many open recommendations are alternatives to another one and
            therefore excluded from total_monthly_saving and
            saving_by_category. Counts include them; money does not.

    RiskFactor:
      type: object
      description: One factor contributing to a recommendation's risk assessment.
      additionalProperties: true

    RuleCalibration:
      type: object
      description: A rule's learned accuracy calibration from observed outcomes.
      additionalProperties: true

    Outcome:
      type: object
      description: A historical execution outcome used for "similar past changes".
      additionalProperties: true

    RecommendationExplanation:
      type: object
      properties:
        recommendation: { $ref: "#/components/schemas/Recommendation" }
        evidence: { type: array, items: { type: object, additionalProperties: true } }
        confidence_inputs: { type: array, items: { $ref: "#/components/schemas/ConfidenceInput" } }
        risk_factors: { type: array, items: { $ref: "#/components/schemas/RiskFactor" } }
        blast_radius: { $ref: "#/components/schemas/BlastRadius" }
        affected_nodes: { type: array, items: { $ref: "#/components/schemas/TwinNode" } }
        alternatives:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
          description: >-
            The other ways of fixing the same problem, ranked, so a reviewer
            sees every option and which one CloudOptix recommends. Empty when
            this recommendation competes with nothing.
        policy_decision: { $ref: "#/components/schemas/PolicyDecision" }
        calibration: { $ref: "#/components/schemas/RuleCalibration" }
        rollback_summary: { type: string }
        narrative: { type: string }
        similar_outcomes: { type: array, items: { $ref: "#/components/schemas/Outcome" } }

    RuleInfo:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        action: { type: string }
        description: { type: string }
        kinds: { type: array, items: { type: string } }
        enabled: { type: boolean }
        thresholds: { type: object, additionalProperties: true }
        calibration: { $ref: "#/components/schemas/RuleCalibration" }

    DismissRequest:
      type: object
      properties:
        reason: { type: string }

    SnoozeRequest:
      type: object
      required: [until]
      properties:
        until: { type: string, format: date-time }
        reason: { type: string }

    # -------------------------------------------------------------
    # Simulations / Cost Compiler / Cost Regression
    # -------------------------------------------------------------
    MutateRequest:
      type: object
      properties:
        scope: { type: string, enum: [application, workload, account] }
        scope_id: { type: string }
        name: { type: string }
        risk_tolerance: { type: string }
        patterns: { type: array, items: { type: string } }
        max_candidates: { type: integer }

    Assumption:
      type: object
      description: A stated modelling assumption behind a simulation or counterfactual result.
      additionalProperties: true

    Candidate:
      type: object
      description: One alternative architecture a mutation search produced.
      additionalProperties: true

    Weights:
      type: object
      description: The scoring weights (cost, performance, reliability, ...) a mutation search used.
      additionalProperties: true

    Simulation:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        scope: { type: string, enum: [application, workload, account] }
        scope_id: { type: string }
        kind: { type: string, enum: [architecture_mutation, counterfactual] }
        baseline_cost: { $ref: "#/components/schemas/Money" }
        candidates: { type: array, items: { $ref: "#/components/schemas/Candidate" } }
        weights: { $ref: "#/components/schemas/Weights" }
        assumptions: { type: array, items: { $ref: "#/components/schemas/Assumption" } }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        status: { type: string }
        error: { type: string }

    SimulationPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Simulation" } }

    Scenario:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [traffic_change, platform_change, database_change, add_cache, remove_nat, add_vpc_endpoint, spot_adoption, region_change, commitment_purchase, storage_class_change, replica_change, custom]
        label: { type: string }
        parameters: { type: object, additionalProperties: true }
        scope_id: { type: string }

    StateProjection:
      type: object
      description: The modelled state of an architecture under a scenario.
      additionalProperties: true

    Counterfactual:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        scenario: { $ref: "#/components/schemas/Scenario" }
        question: { type: string }
        current_state: { $ref: "#/components/schemas/StateProjection" }
        proposed_state: { $ref: "#/components/schemas/StateProjection" }
        cost_delta: { $ref: "#/components/schemas/Money" }
        cost_delta_pct: { type: number }
        annual_cost_delta: { $ref: "#/components/schemas/Money" }
        performance_delta: { type: string }
        reliability_delta: { type: string }
        security_delta: { type: string }
        risk: { $ref: "#/components/schemas/RiskLevel" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        assumptions: { type: array, items: { $ref: "#/components/schemas/Assumption" } }
        caveats: { type: array, items: { type: string } }
        narrative: { type: string }
        computed_at: { type: string, format: date-time }

    SourceKind:
      type: string
      enum: [terraform_plan, terraform_hcl, cloudformation, kubernetes_manifest, helm_release, live_topology]

    PricedChange:
      type: object
      description: One infrastructure change with its priced economic consequence.
      additionalProperties: true

    CompilationResult:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        source: { $ref: "#/components/schemas/SourceKind" }
        label: { type: string }
        changes: { type: array, items: { $ref: "#/components/schemas/PricedChange" } }
        baseline_monthly: { $ref: "#/components/schemas/Money" }
        projected_monthly: { $ref: "#/components/schemas/Money" }
        monthly_delta: { $ref: "#/components/schemas/Money" }
        annual_delta: { $ref: "#/components/schemas/Money" }
        delta_pct: { type: number }

    RegressionCheck:
      type: object
      description: One budget assertion in a regression suite ("monthly delta must not exceed $X").
      additionalProperties: true

    RegressionSuite:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        version: { type: integer }
        checks: { type: array, items: { $ref: "#/components/schemas/RegressionCheck" } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }

    CheckResult:
      type: object
      description: One assertion's pass/fail outcome.
      additionalProperties: true

    RegressionReport:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        compilation_id: { type: string }
        suite_name: { type: string }
        verdict: { type: string, enum: [pass, warn, fail] }
        results: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
        monthly_delta: { $ref: "#/components/schemas/Money" }
        annual_delta: { $ref: "#/components/schemas/Money" }
        summary: { type: string }
        required_action: { type: string, example: "Architecture review required" }

    # -------------------------------------------------------------
    # Policies / Approvals
    # -------------------------------------------------------------
    Match:
      type: object
      description: A policy rule's match predicate (action, category, risk, environment, ...).
      additionalProperties: true

    PolicyRule:
      type: object
      properties:
        id: { type: string }
        description: { type: string }
        match: { $ref: "#/components/schemas/Match" }
        effect: { type: string, enum: [auto_execute, require_approval, prohibit, advisory] }
        approvers: { type: array, items: { type: string } }
        min_approvals: { type: integer }
        require_distinct_approver: { type: boolean }
        maintenance_windows: { type: array, items: { type: string } }
        reason: { type: string }

    Policy:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        name: { type: string }
        description: { type: string }
        version: { type: integer }
        rules: { type: array, items: { $ref: "#/components/schemas/PolicyRule" } }
        default_effect: { type: string, enum: [auto_execute, require_approval, prohibit, advisory], description: "Validation refuses auto_execute here — an unmatched action is by definition unreviewed." }
        enabled: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        checksum: { type: string }

    PolicyDecision:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        recommendation_id: { type: string }
        policy_id: { type: string }
        policy_version: { type: integer }
        policy_checksum: { type: string }
        effect: { type: string, enum: [auto_execute, require_approval, prohibit, advisory] }
        matched_rules: { type: array, items: { type: string } }
        deciding_rule: { type: string }
        reason: { type: string }
        explanation: { type: array, items: { type: string } }
        requires_approval: { type: boolean }
        approvers: { type: array, items: { type: string } }
        min_approvals: { type: integer }
        require_distinct_approver: { type: boolean }
        maintenance_windows: { type: array, items: { type: string } }
        input_digest: { type: string }

    PolicySimulationChange:
      type: object
      properties:
        recommendation_id: { type: string }
        title: { type: string }
        from: { type: string }
        to: { type: string }
        monthly_saving: { $ref: "#/components/schemas/Money" }

    PolicySimulation:
      type: object
      properties:
        policy_name: { type: string }
        evaluated: { type: integer }
        auto_execute: { type: integer }
        require_approval: { type: integer }
        prohibited: { type: integer }
        advisory: { type: integer }
        changes: { type: array, items: { $ref: "#/components/schemas/PolicySimulationChange" } }
        auto_executable_saving: { $ref: "#/components/schemas/Money" }
        warnings: { type: array, items: { type: string } }

    ApprovalContext:
      type: object
      properties:
        monthly_saving: { $ref: "#/components/schemas/Money" }
        annual_saving: { $ref: "#/components/schemas/Money" }
        monthly_cost_delta: { $ref: "#/components/schemas/Money" }
        confidence: { $ref: "#/components/schemas/Confidence" }
        risk_level: { $ref: "#/components/schemas/RiskLevel" }
        blast_summary: { type: string }
        environment: { type: string }
        affected_resources: { type: array, items: { type: string } }
        rollback_plan: { type: string }
        validation_plan: { type: string }
        policy_reason: { type: string }
        diff: { type: string }

    ApprovalResponse:
      type: object
      properties:
        principal: { type: string }
        role: { type: string }
        approved: { type: boolean }
        comment: { type: string }
        at: { type: string, format: date-time }
        ip_address: { type: string }
        user_agent: { type: string }

    ApprovalRequest:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        subject_kind: { type: string, enum: [execution_plan, policy, aws_connection, commitment_purchase] }
        subject_id: { type: string }
        title: { type: string }
        summary: { type: string }
        context: { $ref: "#/components/schemas/ApprovalContext" }
        policy_decision_id: { type: string }
        required_roles: { type: array, items: { type: string } }
        min_approvals: { type: integer }
        require_distinct_approver: { type: boolean }
        state: { type: string, enum: [pending, approved, rejected, expired, withdrawn] }
        responses: { type: array, items: { $ref: "#/components/schemas/ApprovalResponse" } }
        requested_by: { type: string }
        requested_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
        execute_after: { type: string, format: date-time }

    ApprovalPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ApprovalRequest" } }

    DecideApprovalRequest:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
        comment: { type: string }

    # -------------------------------------------------------------
    # Automation / Executions / Savings
    # -------------------------------------------------------------
    PlanExecutionRequest:
      type: object
      properties:
        dry_run: { type: boolean, description: "Runs every precondition and snapshot step, replacing mutating calls with their AWS dry-run equivalent." }
        scheduled_for: { type: string, format: date-time }

    PlanState:
      type: string
      enum: [draft, awaiting_approval, approved, scheduled, preflight, executing, executed, validating, validated, failed, rolling_back, rolled_back, rollback_failed, cancelled]

    Step:
      type: object
      description: One step of an execution plan (precondition, snapshot, mutation, or a rollback/validation step).
      additionalProperties: true

    Snapshot:
      type: object
      description: Captured pre-change state, kept for rollback.
      additionalProperties: true

    RollbackPlan:
      type: object
      description: The steps that reverse this plan's mutation.
      additionalProperties: true

    ValidationPlan:
      type: object
      description: What is checked after execution to confirm the change worked as intended.
      additionalProperties: true

    ExecutionPlan:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        recommendation_id: { type: string }
        action: { type: string }
        title: { type: string }
        account_id: { type: string }
        region: { type: string }
        environment: { type: string }
        resource_ids: { type: array, items: { type: string } }
        steps: { type: array, items: { $ref: "#/components/schemas/Step" } }
        snapshots: { type: array, items: { $ref: "#/components/schemas/Snapshot" } }
        rollback: { $ref: "#/components/schemas/RollbackPlan" }
        validation: { $ref: "#/components/schemas/ValidationPlan" }
        expected_monthly_saving: { $ref: "#/components/schemas/Money" }
        baseline_monthly_cost: { $ref: "#/components/schemas/Money" }
        state: { $ref: "#/components/schemas/PlanState" }
        state_reason: { type: string }
        approval_id: { type: string }
        policy_decision_id: { type: string }
        scheduled_for: { type: string, format: date-time }
        dry_run: { type: boolean }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    ExecutionPlanPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/ExecutionPlan" } }

    CancelExecutionRequest:
      type: object
      properties:
        reason: { type: string }

    RollbackRequest:
      type: object
      properties:
        reason: { type: string }

    PlanValidationResult:
      type: object
      description: The outcome of checking a completed change against its validation plan.
      additionalProperties: true

    AutonomousRunResult:
      type: object
      properties:
        considered: { type: integer }
        planned: { type: integer }
        executed: { type: integer }
        skipped: { type: integer }
        failed: { type: integer }
        rolled_back: { type: integer }
        monthly_saving: { $ref: "#/components/schemas/Money" }
        skip_reasons: { type: object, additionalProperties: { type: integer } }
        duration_ms: { type: integer }

    LearningResult:
      type: object
      properties:
        outcomes_considered: { type: integer }
        rules_calibrated: { type: integer }
        calibrations: { type: object, additionalProperties: { $ref: "#/components/schemas/RuleCalibration" } }
        mean_accuracy: { type: number }

    LeakagePoint:
      type: object
      description: Value lost between two rungs of the savings funnel.
      additionalProperties: true

    SavingsFunnel:
      type: object
      properties:
        tenant_id: { type: string }
        period: { $ref: "#/components/schemas/Period" }
        potential_monthly: { $ref: "#/components/schemas/Money" }
        approved_monthly: { $ref: "#/components/schemas/Money" }
        planned_monthly: { $ref: "#/components/schemas/Money" }
        executed_monthly: { $ref: "#/components/schemas/Money" }
        validated_monthly: { $ref: "#/components/schemas/Money" }
        realized_monthly: { $ref: "#/components/schemas/Money" }
        realized_annual: { $ref: "#/components/schemas/Money" }
        counts: { type: object, additionalProperties: { type: integer } }
        leakage: { type: array, items: { $ref: "#/components/schemas/LeakagePoint" } }
        prediction_accuracy: { type: number, description: "realized / executed — published even when it's bad." }
        computed_at: { type: string, format: date-time }

    # -------------------------------------------------------------
    # Audit
    # -------------------------------------------------------------
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        sequence: { type: integer, format: int64 }
        action: { type: string }
        outcome: { type: string, enum: [success, failure] }
        actor: { type: string }
        machine: { type: boolean }
        subject: { type: string }
        subject_id: { type: string }
        message: { type: string }
        before: { type: object, additionalProperties: true }
        after: { type: object, additionalProperties: true }
        metadata: { type: object, additionalProperties: true }
        at: { type: string, format: date-time }
        hash: { type: string, description: "This entry's link in the tamper-evident hash chain." }

    AuditEntryPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }

    # -------------------------------------------------------------
    # AI Copilot
    # -------------------------------------------------------------
    AskCopilotRequest:
      type: object
      required: [question]
      properties:
        conversation_id: { type: string, description: "Omit to start a new conversation." }
        question: { type: string, example: "Why did our RDS spend go up this month?" }
        context_kind: { type: string, description: "Narrows the question to a resource, application or recommendation the user is looking at." }
        context_id: { type: string }

    Citation:
      type: object
      properties:
        kind: { type: string, enum: [resource, cost_record, recommendation, document, metric] }
        id: { type: string }
        label: { type: string }
        value: { type: string }
        url: { type: string, format: uri }

    ToolResult:
      type: object
      properties:
        tool_call_id: { type: string }
        name: { type: string }
        result: {}
        error: { type: string }
        latency_ms: { type: integer }

    RetrievedDocument:
      type: object
      properties:
        document: { type: object, additionalProperties: true }
        score: { type: number }
        snippet: { type: string }

    CopilotAnswer:
      type: object
      properties:
        conversation_id: { type: string }
        answer: { type: string }
        citations: { type: array, items: { $ref: "#/components/schemas/Citation" } }
        tool_calls: { type: array, items: { $ref: "#/components/schemas/ToolResult" } }
        retrieved: { type: array, items: { $ref: "#/components/schemas/RetrievedDocument" } }
        grounded: { type: boolean, description: "False means the answer could not be tied to tenant data and should be treated with suspicion." }
        grounding_issues: { type: array, items: { type: string } }
        degraded: { type: boolean }
        follow_ups: { type: array, items: { type: string } }
        data: { type: object, additionalProperties: true, description: "Structured payload the UI can render as a chart or table instead of prose." }
        latency_ms: { type: integer }

    Turn:
      type: object
      description: One message in a copilot or onboarding conversation.
      additionalProperties: true

    Conversation:
      type: object
      properties:
        id: { type: string }
        tenant_id: { type: string }
        kind: { type: string, enum: [onboarding, copilot] }
        title: { type: string }
        actor: { type: string }
        turns: { type: array, items: { $ref: "#/components/schemas/Turn" } }

    ConversationPage:
      allOf:
        - $ref: "#/components/schemas/PageEnvelope"
        - type: object
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/Conversation" } }
