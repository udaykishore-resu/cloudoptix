  # ================================================================
  # Executions
  # ================================================================
  /executions:
    parameters: [*tenantHeader, *cursorParam, *limitParam, *sortParam, *orderParam]
    get:
      operationId: executions.list
      tags: [Executions]
      summary: List execution plans
      parameters:
        - { name: state, in: query, schema: { type: array, items: { $ref: "#/components/schemas/PlanState" } }, style: form, explode: true }
      responses:
        "200":
          description: A page of plans.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPlanPage" }
        <<: *commonErrors

  /executions/{id}:
    parameters: [*tenantHeader, *idPathParam]
    get:
      operationId: executions.get
      tags: [Executions]
      summary: Get one execution plan
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPlan" }
        <<: *commonErrors

  /executions/{id}/stream:
    parameters: [*tenantHeader, *idPathParam]
    get:
      operationId: executions.stream
      tags: [Executions]
      summary: Stream a plan's progress
      description: >-
        Polls `GetPlan` roughly once a second and emits a `progress` event
        on every change, terminating with `done` once the plan reaches a
        terminal state (`validated`, `rolled_back`, `cancelled` or
        `rollback_failed`).
      responses:
        "200":
          description: >-
            `text/event-stream` of `progress` events (data: ExecutionPlan)
            and a final `done` event. A plan id that does not resolve ends
            the stream with a terminal `error` event, not an HTTP status —
            the response has already been upgraded by the first fetch.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /executions/{id}/execute:
    parameters: [*tenantHeader, *idPathParam, *idempotencyKey]
    post:
      operationId: executions.execute
      tags: [Executions]
      summary: Execute an approved plan
      description: >-
        Re-checks policy and approval state immediately before touching AWS
        — approval at request time does not imply the plan is still safe to
        run minutes or hours later.
      responses:
        "202":
          description: Execution started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecutionPlan" }
        <<: *commonErrors

  /executions/{id}/cancel:
    parameters: [*tenantHeader, *idPathParam, *idempotencyKey]
    post:
      operationId: executions.cancel
      tags: [Executions]
      summary: Cancel a plan before it executes
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelExecutionRequest" }
      responses:
        "204": { description: Cancelled. }
        <<: *commonErrors

  /executions/{id}/validate:
    parameters: [*tenantHeader, *idPathParam, *idempotencyKey]
    post:
      operationId: executions.validate
      tags: [Executions]
      summary: Evaluate a completed change against its validation plan
      responses:
        "200":
          description: Validation result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanValidationResult" }
