      description: >-
        Decomposes the change between the requested period and the
        immediately preceding period of equal length into ranked
        contributors, answering "why did cost change" rather than merely
        reporting that it did.
      responses:
        "200":
          description: The explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostExplanation" }
              example:
                current_total: { micros: 48210550000, amount: 48210.55, currency: USD, display: "$48,210.55" }
                baseline_total: { micros: 41190020000, amount: 41190.02, currency: USD, display: "$41,190.02" }
                delta: { micros: 7020530000, amount: 7020.53, currency: USD, display: "$7,020.53" }
                delta_pct: 0.1705
                contributors:
                  - dimension: service
                    key: AmazonRDS
                    delta: { micros: 4110000000, amount: 4110.00, currency: USD, display: "$4,110.00" }
                    share: 0.585
                    note: "A read replica was added in us-east-1 on the 12th."
                narrative: "Spend rose 17% week over week, driven mostly by a new RDS read replica."
        <<: *commonErrors

