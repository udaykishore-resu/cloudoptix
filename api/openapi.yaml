      summary: Run one autonomous optimization cycle
      description: >-
        Finds recommendations the active policy permits to auto-execute,
        plans them, executes them within the maintenance window and
        concurrency limits, and schedules validation. Normally invoked by a
        scheduled worker, exposed here for on-demand and support use.
