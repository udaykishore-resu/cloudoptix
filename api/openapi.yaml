          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryStatus" }
        <<: *commonErrors

  /discovery/runs/{runID}:
    parameters: [*tenantHeader, *runIDPathParam]
    get:
      operationId: discovery.get
      tags: [Discovery]
      summary: Get one discovery run
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryRun" }
        <<: *commonErrors

  /discovery/runs/{runID}/stream:
    parameters: [*tenantHeader, *runIDPathParam]
    get:
      operationId: discovery.get_stream
      tags: [Discovery]
      summary: Stream a discovery run's progress
      description: >-
        Polls the same snapshot `Get` this tag's GET-by-id operation uses,
        roughly once a second, and emits a `progress` event whenever the
        snapshot changes, terminating with a `done` event once the run
        reaches `completed`, `failed` or `partial`.
      responses:
        "200":
          description: >-
            `text/event-stream` of `progress` events (data: DiscoveryRun)
            and a final `done` event. A run id that does not resolve (or
            resolves to another tenant's run) ends the stream with a
            terminal `error` event rather than an HTTP status, since the
            response has already been upgraded by the time the first fetch
            runs.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ================================================================
