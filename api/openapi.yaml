    get:
      operationId: savings.funnel
      tags: [Savings]
      summary: Get the realized-savings funnel
      description: >-
        Potential → approved → planned → executed → validated → realized,
        with leakage between each rung and CloudOptix's own prediction
        accuracy. Served by AutomationService — there is no dedicated
        Savings service, since a funnel is exactly what tracks the outcome
        of the plans Automation executes.
      responses:
        "200":
          description: The funnel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavingsFunnel" }
        <<: *commonErrors

  # ================================================================
  # Audit
  # ================================================================
  /audit:
    parameters: [*tenantHeader]
    get:
      operationId: audit.query
      tags: [Audit]
      summary: Query the audit trail
      parameters:
        - *cursorParam
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: action, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: actor, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: outcome, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: subject_id, in: query, schema: { type: string } }
        - *fromParam
        - *toParam
      responses:
        "200":
          description: A page of audit entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEntryPage" }
        <<: *commonErrors

  /audit/verify:
    parameters: [*tenantHeader, *fromParam, *toParam]
    get:
      operationId: audit.verify
      tags: [Audit]
      summary: Verify the audit trail's hash chain over a period
      description: >-
        The audit log is hash-chained; this recomputes and checks it,
        detecting tampering or gaps rather than merely asserting the log is
        trustworthy.
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        <<: *commonErrors

  /audit/recommendations/{recommendationID}/timeline:
    parameters: [*tenantHeader, *recommendationIDPathParam]
    get:
      operationId: audit.timeline
      tags: [Audit]
      summary: Get the full story of one change
      description: >-
        Assembles the recommendation, its policy decision, its approval, its
        execution steps, its validation and its realized savings into one
        ordered timeline.
      responses:
        "200":
          description: The timeline, chronological.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        <<: *commonErrors

  # ================================================================
  # AI Copilot
  # ================================================================
  /copilot/ask:
    parameters: [*tenantHeader]
    post:
      operationId: copilot.ask
      tags: [AI Copilot]
      summary: Ask the copilot a question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskCopilotRequest" }
      responses:
        "200":
          description: A grounded answer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CopilotAnswer" }
              example:
                answer: "Your RDS spend is up 22% this month, mostly from a new read replica in us-east-1 added on the 12th."
                grounded: true
                citations:
                  - kind: cost_record
                    id: "cr_9f2c"
                    label: "AmazonRDS, us-east-1, August"
                    value: "$4,110.00"
                follow_ups:
                  - "Would you like a recommendation to right-size that replica?"
        <<: *commonErrors

  /copilot/ask/stream:
    parameters: [*tenantHeader]
    post:
      operationId: copilot.ask_stream
      tags: [AI Copilot]
      summary: Ask the copilot a question, streamed
      description: >-
        CopilotService.Ask is a single synchronous call, not a token stream
        — there is no incremental-generation port. This emits a `thinking`
        event, calls Ask once, then emits the finished answer as one
        `answer` event followed by `done`, for a client that wants
        consistent SSE handling across onboarding, copilot and job-progress
        endpoints without pretending token-by-token generation exists where
        it does not.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskCopilotRequest" }
      responses:
        "200":
          description: >-
            `text/event-stream` of `thinking`, `answer` (data: CopilotAnswer)
            and `done` events. A failure the copilot service itself raises
            (grounding failure, an ungrounded model output) ends the stream
            with a terminal `error` event; a malformed request body is
            instead a normal `400` below, before the stream is upgraded.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalError" }

  /copilot/conversations:
    parameters: [*tenantHeader, *cursorParam, *limitParam, *sortParam, *orderParam]
    get:
      operationId: copilot.list_conversations
      tags: [AI Copilot]
      summary: List copilot conversations
      responses:
        "200":
          description: A page of conversations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationPage" }
