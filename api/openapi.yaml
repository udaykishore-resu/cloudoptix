  # ================================================================
  # Cost Compiler
  # ================================================================
  /compiler/compile:
    parameters: [*tenantHeader, *idempotencyKey]
    post:
      operationId: compiler.compile
      tags: [Cost Compiler]
      summary: Price an infrastructure-as-code change set
      description: >-
        Accepts the IaC artifact as a raw request body — a Terraform plan
        JSON, a CloudFormation template, a Kubernetes manifest, whatever
        `source` declares — rather than a JSON envelope, so a CI pipeline
        can pipe `terraform show -json plan.out` straight in.
      parameters:
        - { name: source, in: query, schema: { $ref: "#/components/schemas/SourceKind" }, example: terraform_plan }
        - { name: label, in: query, schema: { type: string }, example: "PR #482: add read replica" }
        - { name: region, in: query, schema: { type: string } }
        - { name: account_id, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string } }
        - name: assume_*
          in: query
          schema: { type: number }
          description: >-
            Any `assume_<key>=<number>` query parameter overrides a
            usage-dependent resource's default assumption, e.g.
            `assume_lambda_invocations_per_month=40000000`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          text/plain:
            schema: { type: string }
      responses:
        "201":
          description: The priced change set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompilationResult" }
        <<: *commonErrors

  /compiler/compilations/{id}:
    parameters: [*tenantHeader, *idPathParam]
    get:
