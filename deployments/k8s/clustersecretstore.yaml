# ClusterSecretStore (external-secrets.io) — AWS Secrets Manager backend
# for each environment, authenticating via IRSA (no static AWS credential
# anywhere in the cluster, same principle
# internal/adapters/aws/sts/broker.go's doc comment states for the app's
# own AWS access).
#
# EXTERNAL_SECRETS_IRSA_ROLE_ARN is a placeholder — substitute the ARN of
# an IAM role trusting this cluster's OIDC provider
# (terraform/modules/eks's oidc_provider_arn output) for the subject
# `system:serviceaccount:external-secrets:external-secrets`, granted
# `secretsmanager:GetSecretValue` and `secretsmanager:DescribeSecret`
# scoped to the ARNs in terraform/modules/security's `secret_arns` output
# (plus, for the database password specifically, the RDS module's
# `master_user_secret_arn`). This role is deliberately distinct from any
# of the six application-component IRSA roles security creates — the
# External Secrets Operator's own ServiceAccount needs read access to
# every one of those secret containers, which none of the six
# least-privilege application roles should individually have.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: cloudoptix-dev-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: cloudoptix-staging-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: cloudoptix-production-secret-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
