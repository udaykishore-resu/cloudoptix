name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Catches a newly-disclosed CVE against a dependency that hasn't
    # changed — govulncheck and Trivy's databases update daily even when
    # this repo doesn't.
    - cron: "0 6 * * *"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The toolchain directive in go.mod, not a floating minor: a
          # standard-library CVE is fixed in a specific patch release, and
          # govulncheck reports the stdlib version this job runs, so the
          # version that gets scanned must be the one the image is built
          # with.
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-images:
    name: trivy (container images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: api, dockerfile: deployments/docker/Dockerfile }
          - { name: frontend, dockerfile: deployments/docker/Dockerfile.frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (local, not pushed)
        run: |
          docker buildx build \
            --load \
            -f ${{ matrix.target.dockerfile }} \
            -t cloudoptix-${{ matrix.target.name }}:scan \
            --build-arg VERSION=${{ github.sha }} \
            .
      - name: trivy scan
        uses: aquasecurity/trivy-action@v0.33.1
        env:
          # ghcr.io rate-limits anonymous vulnerability-DB pulls (TOOMANYREQUESTS),
          # which aborts the scan before any SARIF is written; fall back to the
          # public ECR mirror before giving up.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          image-ref: cloudoptix-${{ matrix.target.name }}:scan
          format: sarif
          output: trivy-${{ matrix.target.name }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: upload SARIF
        # always(): findings must reach Code scanning even when the scan step
        # fails on them; the hashFiles guard skips the upload when the scan
        # aborted before writing a report (which would otherwise mask the real
        # error with "Path does not exist").
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.target.name)) != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.target.name }}.sarif
          category: trivy-${{ matrix.target.name }}

  terraform-security:
    name: checkov + tfsec (terraform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@v4
      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          # terraform/demo is INTENTIONALLY misconfigured (unattached
          # volumes, a bucket with no lifecycle policy, three NAT gateways
          # with no S3 endpoint — see that directory's README) — scanning
          # it for "best practice" violations would be checking that a
          # deliberately bad example is bad, which is not a useful CI
          # signal. terraform/bootstrap is excluded because it is a
          # one-time, human-run, local-state configuration, not part of
          # the deployed platform. The input is comma-separated; a
          # multi-line value is passed through as one regex containing a
          # newline, which matches nothing and scans both directories.
          skip_path: terraform/demo,terraform/bootstrap
          # soft_fail: the findings are uploaded as SARIF below and triaged
          # in the repository's Security tab (code scanning) rather than
          # failing this job. Flip to false once the open findings there
          # are resolved or suppressed with a documented .checkov.yaml.
          soft_fail: true
      - name: upload checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
      - name: tfsec
        uses: aquasecurity/tfsec-sarif-action@v0.1.4
        with:
          sarif_file: tfsec-results.sarif
          working_directory: terraform
      - name: upload tfsec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: tfsec-results.sarif
          category: tfsec
