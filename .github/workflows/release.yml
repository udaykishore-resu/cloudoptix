name: Release

# Fires on a semver tag push (v1.2.3, v1.2.3-rc.1, ...). Builds and pushes
# multi-arch images for the API and frontend to GHCR, generates an SBOM for
# each, signs both the images and the SBOMs with cosign (keyless, via GitHub
# OIDC — no private key stored anywhere), and packages+publishes the Helm
# chart as an OCI artifact alongside them. Nothing here creates a GitHub
# Release body claiming the binary works end-to-end out of the box: see the
# cmd/ gap noted in deployments/docker/README.md. What this workflow
# guarantees is that whatever IS buildable today is built reproducibly,
# signed, and traceable back to this exact commit.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # create the GitHub Release
  packages: write    # push to GHCR
  id-token: write    # cosign keyless signing via OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  HELM_VERSION: "3.16.4"
  COSIGN_VERSION: "2.4.1"
  SYFT_VERSION: "1.18.0"

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          # v1.2.3 -> 1.2.3. Used as the OCI tag and as the Dockerfile's
          # VERSION build-arg (see deployments/docker/README.md's
          # version-stamping section) — the same string ends up in
          # /version served by the (future) API and in the Helm chart's
          # appVersion, so `cloudoptix version` and the image tag never
          # disagree.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  images:
    name: build, sign & push (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: api
            dockerfile: deployments/docker/Dockerfile
            image: cloudoptix-api
          - name: frontend
            dockerfile: deployments/docker/Dockerfile.frontend
            image: cloudoptix-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ !contains(needs.version.outputs.version, '-') }}

      - name: build & push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # Digest-pinned provenance for cosign to sign below — a tag can
          # move, a digest can't.
          provenance: true
          sbom: false # we generate our own SBOM with syft, see next step,
                      # so the report has one consistent format across
                      # both images rather than mixing buildx's and syft's.

      - name: install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v${{ env.SYFT_VERSION }}

      - name: generate SBOM
        run: |
          syft "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target.image }}@${{ steps.build.outputs.digest }}" \
            -o spdx-json="sbom-${{ matrix.target.name }}.spdx.json"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.target.name }}
          path: sbom-${{ matrix.target.name }}.spdx.json

      - name: install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v${{ env.COSIGN_VERSION }}

      - name: sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target.image }}@${{ steps.build.outputs.digest }}"

      - name: attach & sign SBOM attestation
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.target.name }}.spdx.json" \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.target.image }}@${{ steps.build.outputs.digest }}"

  helm-chart:
    name: package & publish Helm chart
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: log in to GHCR (OCI registry)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin

      - name: set chart version
        # The chart's own version tracks the same tag as the images it
        # deploys by default (values.yaml's global.imageTag). They CAN
        # drift on purpose (a chart-only fix bumping without a new image),
        # but a release build always stamps them together so `helm show
        # chart` on a release artifact tells an SRE exactly which image
        # tag it was built against.
        run: |
          sed -i "s/^version: .*/version: ${{ needs.version.outputs.version }}/" helm/cloudoptix/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ needs.version.outputs.version }}\"/" helm/cloudoptix/Chart.yaml

      - run: helm lint helm/cloudoptix

      - name: package
        run: helm package helm/cloudoptix -d dist/

      - name: push to GHCR (OCI)
        run: |
          helm push dist/cloudoptix-${{ needs.version.outputs.version }}.tgz \
            oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/charts

      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  github-release:
    name: create GitHub Release
    runs-on: ubuntu-latest
    needs: [version, images, helm-chart]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: "sbom-*"
          merge-multiple: true
          path: release-assets/
      - uses: actions/download-artifact@v4
        with:
          name: helm-chart
          path: release-assets/
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          files: release-assets/*
          body: |
            Images:
            - `ghcr.io/${{ github.repository_owner }}/cloudoptix-api:${{ needs.version.outputs.version }}`
            - `ghcr.io/${{ github.repository_owner }}/cloudoptix-frontend:${{ needs.version.outputs.version }}`

            Both are signed keylessly with cosign (verify with
            `cosign verify --certificate-identity-regexp '.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>`)
            and carry an attached, signed SPDX SBOM attestation.

            Helm chart: `oci://ghcr.io/${{ github.repository_owner }}/charts/cloudoptix:${{ needs.version.outputs.version }}`
