{{/*
One Deployment per entry in .Values.components (the API plus five
independently-scaling workers). Ranging over the map here — rather than
six near-identical template files — is what guarantees every component's
Deployment has the exact same shape (security context, probes, topology
spread, volume mounts) except for the values that are supposed to differ:
image args, resources, replica count. A reviewer diffing this one file
against values.yaml sees the whole story; six copy-pasted files would
invite the six of them silently drifting from each other over time.

Every component — API and every worker alike — runs the platform binary's
health/metrics HTTP listener (internal/infrastructure/server.Health,
internal/infrastructure/telemetry) on containerPort, even a worker that
serves no public API route: that is what /healthz, /readyz and /metrics
below are probing and what the ServiceMonitor scrapes.
*/}}
{{- range $name, $comp := .Values.components }}
{{- if $comp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudoptix.componentFullname" (list $ $name $comp) }}
  labels:
    {{- include "cloudoptix.componentLabels" (list $ $name $comp) | nindent 4 }}
spec:
  {{- if not $comp.autoscaling.enabled }}
  replicas: {{ $comp.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cloudoptix.componentSelectorLabels" (list $ $name $comp) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudoptix.componentLabels" (list $ $name $comp) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "cloudoptix.componentServiceAccountName" (list $ $name $comp) }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range $.Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "cloudoptix.componentSelectorLabels" (list $ $name $comp) | nindent 14 }}
        {{- end }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "cloudoptix.componentName" (list $name $comp) }}
          image: {{ include "cloudoptix.image" (list $ $comp) }}
          imagePullPolicy: {{ $comp.image.pullPolicy | default $.Values.global.imagePullPolicy }}
          command: {{ toYaml $comp.command | nindent 12 }}
          args: {{ toYaml (append $comp.args "--config=/etc/cloudoptix/config.yaml") | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ $comp.containerPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "cloudoptix.fullname" $ }}-config
          env:
            {{- include "cloudoptix.secretEnv" $ | nindent 12 }}
            {{- with $comp.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # Covers cold start (JWKS fetch, DB pool warm-up, migrations
            # already applied by the pre-install/pre-upgrade hook Job) —
            # 30 x 5s = up to 150s before liveness starts counting failures
            # against a pod that simply hasn't finished starting yet.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: config-file
              mountPath: /etc/cloudoptix
              readOnly: true
            {{- with $.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-file
          configMap:
            name: {{ include "cloudoptix.fullname" $ }}-config-file
        {{- with $.Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
---
{{- end }}
{{- end }}
