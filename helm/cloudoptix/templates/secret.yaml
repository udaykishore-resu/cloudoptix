{{/*
Plain Secret rendered directly from Helm values — dev/local only. See
values.yaml's secrets block and this chart's README for why this path must
never be used with a real credential: `helm get values` and `helm history`
both keep this value in plaintext in Helm's own release storage
indefinitely, which is a fine trade-off for a throwaway local password and
an unacceptable one for anything real.
*/}}
{{- if not .Values.secrets.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudoptix.fullname" . }}-secrets
  labels:
    {{- include "cloudoptix.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_PASSWORD: {{ .Values.secrets.values.databasePassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.values.redisPassword | quote }}
  AWS_ASSUME_ROLE_EXTERNAL_ID: {{ .Values.secrets.values.awsExternalId | quote }}
  LLM_API_KEY: {{ .Values.secrets.values.llmApiKey | quote }}
  AUTH_SERVICE_TOKEN_SECRET: {{ .Values.secrets.values.authServiceToken | quote }}
{{- end }}
