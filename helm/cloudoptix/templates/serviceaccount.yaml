{{- range $name, $comp := .Values.components }}
{{- if $comp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudoptix.componentServiceAccountName" (list $ $name $comp) }}
  labels:
    {{- include "cloudoptix.componentLabels" (list $ $name $comp) | nindent 4 }}
  annotations:
    {{- with $.Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if $comp.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ $comp.serviceAccount.roleArn | quote }}
    {{- end }}
# IRSA: eks.amazonaws.com/role-arn matches this exact ServiceAccount's
# namespace/name against the sts:sub condition
# terraform/modules/security's IRSA trust policy for this component
# requires — see that module's README. A component with no roleArn set
# still gets a real ServiceAccount (never "default"); it simply has no AWS
# permissions until one is set.
---
{{- end }}
{{- end }}
{{- if .Values.migration.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cloudoptix.fullname" . }}-migration
  labels:
    {{- include "cloudoptix.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.migration.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ .Values.migration.serviceAccount.roleArn | quote }}
    {{- end }}
{{- end }}

