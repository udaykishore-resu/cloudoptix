{{/*
ExternalSecret (external-secrets.io) syncing every credential from
whatever SecretStore/ClusterSecretStore secrets.externalSecrets.secretStoreRef
names — an AWS Secrets Manager-backed store pointed at the secrets
terraform/modules/security creates, in the production case — into the same
"<fullname>-secrets" Secret name templates/secret.yaml would otherwise
create, so every Deployment's env/secretKeyRef references are identical
regardless of which mode is active. Exactly one of secret.yaml /
externalsecret.yaml ever renders a Secret with this name — see
secrets.externalSecrets.enabled in values.yaml.
*/}}
{{- if .Values.secrets.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "cloudoptix.fullname" . }}-secrets
  labels:
    {{- include "cloudoptix.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "cloudoptix.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.database.remoteRef | quote }}
        # RDS-managed master-user secrets (terraform/modules/rds's
        # manage_master_user_password=true) store the password inside a
        # JSON blob with a "password" field rather than as the whole
        # secret value — set this property when remoteRef points at one of
        # those secrets instead of one of security's plain-string
        # containers.
        {{- if .Values.secrets.externalSecrets.database.property }}
        property: {{ .Values.secrets.externalSecrets.database.property }}
        {{- end }}
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.redis.remoteRef | quote }}
    - secretKey: AWS_ASSUME_ROLE_EXTERNAL_ID
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.awsExternalId.remoteRef | quote }}
    - secretKey: LLM_API_KEY
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.llmApiKey.remoteRef | quote }}
    - secretKey: AUTH_SERVICE_TOKEN_SECRET
      remoteRef:
        key: {{ .Values.secrets.externalSecrets.authServiceToken.remoteRef | quote }}
{{- end }}
