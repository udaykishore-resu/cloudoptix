# Applied AFTER `terraform apply` (see outputs.tf's eks_kubeconfig_command)
# — not by Terraform itself. This repo's convention keeps
# infrastructure-level provisioning (Terraform) separate from
# workload-level Kubernetes objects (applied via kubectl/Helm/ArgoCD); see
# deployments/k8s/README.md.
#
# THE PATHOLOGY: this Deployment requests 4 CPU / 8Gi memory per replica,
# times 3 replicas — enough to force the demo's single t3.medium (2 vCPU /
# 4GiB) node group to scale to its max (3 nodes) just to satisfy scheduling,
# even though the container inside does nothing but sleep. This is
# "wildly over-declared pod requests": the requests, not actual usage, are
# what CloudOptix's adjust_pod_resources recommendation
# (internal/adapters/aws/executor's action of the same name) targets —
# actual CPU/memory utilization would be near zero, visible immediately in
# any metrics-server/Prometheus scrape once this is applied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oversized-requests-demo
  namespace: default
  labels:
    app: oversized-requests-demo
    cloudoptix.io/pathology: eks-oversized-pod-requests
spec:
  replicas: 3
  selector:
    matchLabels:
      app: oversized-requests-demo
  template:
    metadata:
      labels:
        app: oversized-requests-demo
    spec:
      # Runs on the On-Demand node group's un-tainted nodes — the demo eks
      # module (unlike the platform eks module) has no Spot group and no
      # taint to tolerate, on purpose: the point is that pod requests alone
      # force the node group to scale, not that scheduling was constrained.
      containers:
        - name: idle
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: "4"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
